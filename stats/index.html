<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Site traffic for johna.kiwi">
    <meta name="theme-color" content="#eef4f6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#071014" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <title>Site traffic - johna.kiwi</title>
    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("theme");
        } catch (e) {
          t = null;
        }
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=optional"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="/styles.css">
    <!-- build:analytics:start -->
    <!-- build:analytics:end -->
  </head>
  <body class="stats-page">
    <a class="skip-link" href="#main">Skip to content</a>

    <svg class="sprite" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="i-auto" viewBox="0 0 24 24">
          <path
            d="M12 2v2M14.837 16.385a6 6 0 1 1-7.223-7.222c.624-.147.97.66.715 1.248a4 4 0 0 0 5.26 5.259c.589-.255 1.396.09 1.248.715M16 12a4 4 0 0 0-4-4M19 5l-1.256 1.256M20 12h2"
          ></path>
        </symbol>
        <symbol id="i-light" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4"></circle>
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
          ></path>
        </symbol>
        <symbol id="i-dark" viewBox="0 0 24 24">
          <path
            d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"
          ></path>
        </symbol>
      </defs>
    </svg>

    <header class="site-header">
      <a class="brand" href="/">johna.kiwi</a>
      <button
        class="theme-toggle"
        type="button"
        id="theme-toggle"
        aria-live="polite"
        title="Change colour theme"
        hidden
      >
        <svg class="icon theme-icon theme-icon-auto" aria-hidden="true" focusable="false">
          <use href="#i-auto"></use>
        </svg>
        <svg class="icon theme-icon theme-icon-light" aria-hidden="true" focusable="false">
          <use href="#i-light"></use>
        </svg>
        <svg class="icon theme-icon theme-icon-dark" aria-hidden="true" focusable="false">
          <use href="#i-dark"></use>
        </svg>
        <span class="visually-hidden" id="theme-label">Colour theme: system</span>
      </button>
    </header>

    <main id="main" class="stats" data-stats>
      <div class="stats-tabs-bar">
        <div class="stats-tabs-inner">
          <p class="eyebrow">Site traffic</p>
          <div class="stats-tabs" role="tablist" aria-label="Traffic reports">
            <button
              type="button"
              class="stats-tab is-active"
              role="tab"
              id="tab-paths"
              aria-selected="true"
              aria-controls="panel-paths"
              data-tab="paths"
              tabindex="0"
            >
              Top paths - this week
            </button>
            <button
              type="button"
              class="stats-tab"
              role="tab"
              id="tab-30d"
              aria-selected="false"
              aria-controls="panel-30d"
              data-tab="30d"
              tabindex="-1"
            >
              Last 30 days
            </button>
            <button
              type="button"
              class="stats-tab"
              role="tab"
              id="tab-ytd"
              aria-selected="false"
              aria-controls="panel-ytd"
              data-tab="ytd"
              tabindex="-1"
            >
              This year to date
            </button>
          </div>
        </div>
      </div>

      <div
        class="stats-panel is-active"
        role="tabpanel"
        id="panel-paths"
        aria-labelledby="tab-paths"
        data-panel="paths"
      >
        <iframe
          class="stats-frame"
          title="Top paths - this week"
          allowfullscreen
          sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
          src="https://datastudio.google.com/embed/reporting/c6f4d3d5-ae34-4445-a34d-ee07e582237b/page/7Kt9F"
          loading="eager"
        ></iframe>
      </div>

      <div
        class="stats-panel"
        role="tabpanel"
        id="panel-30d"
        aria-labelledby="tab-30d"
        data-panel="30d"
        hidden
      >
        <iframe
          class="stats-frame"
          title="Last 30 days"
          allowfullscreen
          sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
          data-src="https://datastudio.google.com/embed/reporting/2b57017b-ea07-4124-9697-561c2e5b45fa/page/7Kt9F"
          loading="lazy"
        ></iframe>
      </div>

      <div
        class="stats-panel"
        role="tabpanel"
        id="panel-ytd"
        aria-labelledby="tab-ytd"
        data-panel="ytd"
        hidden
      >
        <iframe
          class="stats-frame"
          title="This year to date"
          allowfullscreen
          sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
          data-src="https://datastudio.google.com/embed/reporting/f74d20ed-d5dd-4bf3-8ff1-783de7da87d6/page/7Kt9F"
          loading="lazy"
        ></iframe>
      </div>
    </main>

    <script>
      (function () {
        var button = document.getElementById("theme-toggle");
        var label = document.getElementById("theme-label");
        if (!button || !label) {
          return;
        }
        var modes = ["system", "light", "dark"];
        var labels = {
          system: "Colour theme: system",
          light: "Colour theme: light",
          dark: "Colour theme: dark"
        };

        function current() {
          try {
            var t = localStorage.getItem("theme");
            if (t === "light" || t === "dark") {
              return t;
            }
          } catch (e) {
            /* ignore */
          }
          return "system";
        }

        function apply(mode) {
          if (mode === "light" || mode === "dark") {
            document.documentElement.dataset.theme = mode;
            try {
              localStorage.setItem("theme", mode);
            } catch (e) {
              /* ignore */
            }
          } else {
            delete document.documentElement.dataset.theme;
            try {
              localStorage.removeItem("theme");
            } catch (e) {
              /* ignore */
            }
          }
          document.documentElement.dataset.themeMode = mode;
          label.textContent = labels[mode];
          button.setAttribute("title", labels[mode]);
        }

        apply(current());
        button.hidden = false;
        button.addEventListener("click", function () {
          apply(modes[(modes.indexOf(current()) + 1) % modes.length]);
        });
      })();

      (function () {
        var root = document.querySelector("[data-stats]");
        if (!root) {
          return;
        }
        var tabs = Array.prototype.slice.call(root.querySelectorAll('[role="tab"]'));
        var panels = Array.prototype.slice.call(root.querySelectorAll("[data-panel]"));

        function activate(id) {
          tabs.forEach(function (tab) {
            var on = tab.getAttribute("data-tab") === id;
            tab.classList.toggle("is-active", on);
            tab.setAttribute("aria-selected", on ? "true" : "false");
            tab.tabIndex = on ? 0 : -1;
          });
          panels.forEach(function (panel) {
            var on = panel.getAttribute("data-panel") === id;
            panel.classList.toggle("is-active", on);
            panel.hidden = !on;
            if (on) {
              var frame = panel.querySelector("iframe");
              if (frame && !frame.getAttribute("src")) {
                var src = frame.getAttribute("data-src");
                if (src) {
                  frame.setAttribute("src", src);
                }
              }
            }
          });
        }

        tabs.forEach(function (tab) {
          tab.addEventListener("click", function () {
            activate(tab.getAttribute("data-tab"));
          });
        });

        var tablist = root.querySelector(".stats-tabs");
        if (tablist) {
          tablist.addEventListener("keydown", function (event) {
            var i = tabs.indexOf(document.activeElement);
            if (i < 0) {
              return;
            }
            var next = i;
            if (event.key === "ArrowRight" || event.key === "ArrowDown") {
              next = (i + 1) % tabs.length;
            } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
              next = (i - 1 + tabs.length) % tabs.length;
            } else if (event.key === "Home") {
              next = 0;
            } else if (event.key === "End") {
              next = tabs.length - 1;
            } else {
              return;
            }
            event.preventDefault();
            tabs[next].focus();
            activate(tabs[next].getAttribute("data-tab"));
          });
        }
      })();
    </script>
  </body>
</html>
